name: Release

# Pushing a tag such as v1.0.0-alpha.4 builds the binaries and publishes them on that tag's GitHub release.
# It can also be run by hand from the Actions tab with a tag name: the tag is made on the branch it is run on
# when it does not exist yet.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, such as v1.0.0-alpha.6.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: linewright
            asset: linewright-linux-x86_64
          - os: windows-latest
            binary: linewright.exe
            asset: linewright-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --release
      - name: Name the binary for the release
        shell: bash
        # Steps run in rust/, and the artifact is taken from the top of the checkout.
        run: cp target/release/${{ matrix.binary }} ../${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linewright-*
          merge-multiple: true
      - name: Write checksums
        run: sha256sum linewright-linux-x86_64 linewright-windows-x86_64.exe > SHA256SUMS
      - name: Upload to the release, creating it if needed
        run: |
          files="linewright-linux-x86_64 linewright-windows-x86_64.exe SHA256SUMS"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            case "$TAG" in
              *-alpha*|*-beta*|*-rc*) prerelease="--prerelease" ;;
              *) prerelease="" ;;
            esac
            gh release create "$TAG" $files --title "$TAG" --target "$TARGET" --generate-notes $prerelease
          fi
