[package]
name = "linewright-setup"
version.workspace = true
edition = "2024"
description = "Installs Linewright, and removes it again"
license = "MIT"
build = "build.rs"

[dependencies]
linewright = { path = ".." }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
flate2 = "1"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
flate2 = "1"

[dev-dependencies]
tempfile = "3"
